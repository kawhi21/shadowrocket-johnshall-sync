name: Sync Johnshall routing rules
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: johnshall-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Test failure protection
        run: python3 -m unittest discover -s tests -v
      - name: Check public source before download
        run: python3 scripts/check_repo.py
      - name: Download and validate in memory
        run: python3 scripts/sync.py
      - name: Verify all generated hashes and templates before committing
        run: python3 scripts/check_repo.py
      - name: Commit only validated routing data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- generated/validation.json generated/proxy.list generated/reject.list
          if git diff --cached --quiet; then
            echo 'Validated upstream is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated Johnshall routing rules'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
      - name: Publish verified versioned snapshot after successful sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --commit "$(git rev-parse HEAD)"
